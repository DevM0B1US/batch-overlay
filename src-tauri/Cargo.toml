[package]
name = "batch-overlay"
version = "0.1.0"
description = "Fast, lightweight batch image overlay tool"
edition = "2021"

[lib]
name = "batch_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
